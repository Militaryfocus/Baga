version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ml_community_postgres
    environment:
      POSTGRES_DB: mobile_legends_community
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ml_network

  redis:
    image: redis:7-alpine
    container_name: ml_community_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - ml_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml_community_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ml_user:ml_password_2024@postgres:5432/mobile_legends_community
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-2024-mobile-legends
      PORT: 3001
    ports:
      - "3002:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - ml_network

volumes:
  postgres_data:
  redis_data:

networks:
  ml_network:
    driver: bridge

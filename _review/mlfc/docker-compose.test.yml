services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"

  backend:
    image: node:18-alpine
    container_name: test_backend
    working_dir: /app
    command: sh -c "npm init -y && npm install express && echo 'Backend ready' && node -e 'console.log(\"Backend running on port 3001\")'"
    ports:
      - "3001:3001"
    depends_on:
      - postgres

  frontend:
    image: node:18-alpine
    container_name: test_frontend
    working_dir: /app
    command: sh -c "npm init -y && npm install express && echo 'Frontend ready' && node -e 'console.log(\"Frontend running on port 3000\")'"
    ports:
      - "3000:3000"
    depends_on:
      - backend
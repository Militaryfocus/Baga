services:
  postgres:
    image: postgres:15-alpine
    container_name: ml_postgres
    environment:
      POSTGRES_DB: mobile_legends_community
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password_2024
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ml_redis
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: ml_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ml_user:ml_password_2024@postgres:5432/mobile_legends_community
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-2024-mobile-legends
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.simple
    container_name: ml_frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
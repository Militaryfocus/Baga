version: '3.8'

services:
  # PostgreSQL Database - using Debian-based image as fallback
  postgres:
    image: postgres:15
    container_name: ml_community_postgres_simple
    environment:
      POSTGRES_DB: mobile_legends_community
      POSTGRES_USER: ml_user
      POSTGRES_PASSWORD: ml_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_simple:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ml_network_simple
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_user -d mobile_legends_community"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache - using Debian-based image as fallback
  redis:
    image: redis:7
    container_name: ml_community_redis_simple
    ports:
      - "6379:6379"
    volumes:
      - redis_data_simple:/data
    networks:
      - ml_network_simple
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API - using simple Dockerfile
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: ml_community_backend_simple
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ml_user:ml_password_2024@postgres:5432/mobile_legends_community
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-2024-mobile-legends
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - ml_network_simple
    command: npm run dev

  # Frontend React App - using simple Dockerfile
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.simple
    container_name: ml_community_frontend_simple
    environment:
      VITE_API_URL: http://localhost:3001/api
      VITE_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ml_network_simple

  # Nginx Reverse Proxy - using Debian-based image as fallback
  nginx:
    image: nginx:1.25
    container_name: ml_community_nginx_simple
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ml_network_simple
    restart: unless-stopped

volumes:
  postgres_data_simple:
  redis_data_simple:

networks:
  ml_network_simple:
    driver: bridge